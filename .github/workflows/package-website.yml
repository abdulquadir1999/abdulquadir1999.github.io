name: Package website

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ZIP_NAME: abdulquadir-website-complete.zip

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create ZIP
        run: |
          zip -r "$ZIP_NAME" . -x '.git/*' '.github/workflows/package-website.yml' "$ZIP_NAME"
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: abdulquadir-website-complete
          path: ${{ env.ZIP_NAME }}
          retention-days: 7
